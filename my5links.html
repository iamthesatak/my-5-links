<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Sites</title>
</head>
<style>/* General page styling */
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 0;
    text-align: center;
}

/* Header styling */
header {
    background: #3498db;
    color: white;
    padding: 20px;
    font-size: 1.8rem;
    font-weight: bold;
    letter-spacing: 1px;
}

/* Horizontal line styling */
hr {
    border: none;
    height: 2px;
    background: #ddd;
    margin: 0;
}

/* Main container */
main {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 30px;
}

/* Link cards */
main a {
    text-decoration: none;
    color: #333;
    background: white;
    padding: 15px 25px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
    font-size: 1.2rem;
    font-weight: 500;
}

/* Hover effect */
main a:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 15px rgba(0,0,0,0.2);
    color: #3498db;
    border: 2px solid #3498db;
}

/* Optional brand accents */
a[href*="google"] { border-bottom: 4px solid #4285F4; }
a[href*="youtube"] { border-bottom: 4px solid #FF0000; }
a[href*="instagram"] { border-bottom: 4px solid #C13584; }
a[href*="x.com"] { border-bottom: 4px solid #000000; }
a[href*="Whatsapp"] { border-bottom: 4px solid #25D366; }
</style>
<body>
    <header><big>My Top 5 Sites</big></header>
    <hr>
<main>
        <a href="https://google.com" target="_blank">google</a>
        <a href="https://youtube.com" target="_blank">youtube</a>
        <a href="https://instagram.com" target="_blank">instagram</a>
        <a href="https://x.com" target="_blank">tweeter_X</a>
        <a href="https://Whatsapp.com" target="_blank">Whatsapp</a>
    </main>
</body>
</html>
